services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: edumaster_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edumaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edumaster"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Strapi Backend ──────────────────────────────────────────
  strapi:
    image: edumaster-strapi:latest
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: edumaster_strapi
    restart: unless-stopped
    env_file: ./apps/backend/.env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: edumaster
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "123456"
      NODE_ENV: production
    volumes:
      - ./uploads:/opt/app/public/uploads
      - ./backups:/opt/app/database
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy

  # ── React Frontend + Nginx SSL Proxy ────────────────────────
  web:
    image: edumaster-web:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: edumaster_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - strapi

  # ── Auto Daily Database Backup (FIFO) ───────────────────────
  backup:
    image: postgres:17-alpine
    container_name: edumaster_backup
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: edumaster
      DATABASE_USERNAME: postgres
      PGPASSWORD: "123456"
      KEEP_DAYS: "7"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/entrypoint-backup.sh:/entrypoint-backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/entrypoint-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  strapi_uploads:
